config:
  credentials:
  - id: https://gitlab.acnca.pt/eosc/eosc-synergy/sqaaas-api-server
    password_var: GIT_PASSWORD
    username_var: GIT_USER
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    gitlab.acnca.pt/eosc/eosc-synergy/sqaaas-api-server:
      branch: testci
      credential_tmp: true
      credentials_id: https://gitlab.acnca.pt/eosc/eosc-synergy/sqaaas-api-server
      repo: https://gitlab.acnca.pt/eosc/eosc-synergy/sqaaas-api-server
