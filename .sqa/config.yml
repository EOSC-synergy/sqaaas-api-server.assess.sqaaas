config:
  credentials:
  - id: https://github.com/eosc-synergy/sqaaas-api-server
    password_var: GIT_PASSWORD
    username_var: GIT_USER
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/eosc-synergy/sqaaas-api-server:
      branch: main
      credential_tmp: true
      credentials_id: https://github.com/eosc-synergy/sqaaas-api-server
      repo: https://github.com/eosc-synergy/sqaaas-api-server
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/eosc-synergy/sqaaas-api-server git:
        commands:
        - /usr/bin/env sh .sqa/script.claret_supportive_rhinoceros.sh
        container: qc.acc_denim_elated_cassowary
  QC.Doc:
    repos:
      github.com/eosc-synergy/sqaaas-api-server find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.cinnamon_patient_toad.sh
        container: qc.doc_green_observant_manatee
      github.com/eosc-synergy/sqaaas-api-server git:
        commands:
        - /usr/bin/env sh .sqa/script.peony_sincere_ocelot.sh
        container: qc.doc_flint_clever_tiger
      github.com/eosc-synergy/sqaaas-api-server markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.celadon_driven_serval.sh
        container: qc.doc_peony_wise_caribou
  QC.Lic:
    repos:
      github.com/eosc-synergy/sqaaas-api-server licensee:
        commands:
        - /usr/bin/env sh .sqa/script.coral_analytical_groundhog.sh
        container: qc.lic_chili_rational_ocelot
  QC.Met:
