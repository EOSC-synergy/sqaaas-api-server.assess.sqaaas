config:
  credentials:
  - id: https://github.com/eosc-synergy/sqaaas-api-server
    password_var: GIT_PASSWORD
    username_var: GIT_USER
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/eosc-synergy/sqaaas-api-server:
      branch: main
      credential_tmp: true
      credentials_id: https://github.com/eosc-synergy/sqaaas-api-server
      repo: https://github.com/eosc-synergy/sqaaas-api-server
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/eosc-synergy/sqaaas-api-server git:
        commands:
        - /usr/bin/env sh .sqa/script.cayenne_alert_leopard.sh
        container: qc.acc_viridian_thoughtful_raccoon
  QC.Doc:
    repos:
      github.com/eosc-synergy/sqaaas-api-server find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.claret_compassionate_capybara.sh
        container: qc.doc_strawberry_adaptable_whale
      github.com/eosc-synergy/sqaaas-api-server git:
        commands:
        - /usr/bin/env sh .sqa/script.chestnut_affectionate_dugong.sh
        container: qc.doc_lilac_energetic_jellyfish
      github.com/eosc-synergy/sqaaas-api-server markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.orange_honest_okapi.sh
        container: qc.doc_emerald_ardent_elk
  QC.Lic:
    repos:
      github.com/eosc-synergy/sqaaas-api-server licensee:
        commands:
        - /usr/bin/env sh .sqa/script.horizon_content_turtle.sh
        container: qc.lic_eggplant_insightful_caribou
  QC.Met:
    repos:
      github.com/eosc-synergy/sqaaas-api-server cff-converter-python:
        commands:
        - /usr/bin/env sh .sqa/script.ruby_audacious_nighthawk.sh
        container: qc.met_orchid_zealous_swan
  QC.Sec:
    repos:
      github.com/eosc-synergy/sqaaas-api-server bandit:
        commands:
        - /usr/bin/env sh .sqa/script.claret_authentic_goat.sh
        container: qc.sec_purple_diplomatic_weasel
  QC.Sty:
    repos:
      github.com/eosc-synergy/sqaaas-api-server flake8:
        commands:
        - /usr/bin/env sh .sqa/script.linen_bold_axolotl.sh
        container: qc.sty_crimson_restless_giraffe
      github.com/eosc-synergy/sqaaas-api-server hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.glacier_forgiving_alpaca.sh
        container: qc.sty_violet_mysterious_puffin
      github.com/eosc-synergy/sqaaas-api-server jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.navy_humble_dingo.sh
        container: qc.sty_chili_balanced_boar
