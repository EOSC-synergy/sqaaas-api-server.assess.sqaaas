config:
  credentials:
  - id: https://gitlab.acnca.pt/eosc/eosc-synergy/sqaaas-api-server
    password_var: GIT_PASSWORD
    username_var: GIT_USER
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    gitlab.acnca.pt/eosc/eosc-synergy/sqaaas-api-server:
      branch: testci
      credential_tmp: true
      credentials_id: https://gitlab.acnca.pt/eosc/eosc-synergy/sqaaas-api-server
      repo: https://gitlab.acnca.pt/eosc/eosc-synergy/sqaaas-api-server
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      gitlab.acnca.pt/eosc/eosc-synergy/sqaaas-api-server git:
        commands:
        - /usr/bin/env sh .sqa/script.green_tactful_groundhog.sh
        container: qc.acc_flamingo_visionary_coyote
  QC.Doc:
