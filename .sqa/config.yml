      gitlab.acnca.pt/eosc/eosc-synergy/sqaaas-api-server get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.avocado_persistent_baboon.sh
        container: qc.ver_gold_foolish_leopard
timeout: 5400
