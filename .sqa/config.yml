config:
  credentials:
  - id: https://gitlab.acnca.pt/eosc/eosc-synergy/sqaaas-api-server
    password_var: GIT_PASSWORD
    username_var: GIT_USER
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    gitlab.acnca.pt/eosc/eosc-synergy/sqaaas-api-server:
      branch: testci
      credential_tmp: true
      credentials_id: https://gitlab.acnca.pt/eosc/eosc-synergy/sqaaas-api-server
      repo: https://gitlab.acnca.pt/eosc/eosc-synergy/sqaaas-api-server
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      gitlab.acnca.pt/eosc/eosc-synergy/sqaaas-api-server git:
        commands:
        - /usr/bin/env sh .sqa/script.jade_meticulous_manatee.sh
        container: qc.acc_steel_relaxed_iguana
  QC.Doc:
    repos:
      gitlab.acnca.pt/eosc/eosc-synergy/sqaaas-api-server find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.pink_bold_python.sh
        container: qc.doc_azure_loyal_snail
      gitlab.acnca.pt/eosc/eosc-synergy/sqaaas-api-server git:
        commands:
        - /usr/bin/env sh .sqa/script.yellow_goofy_axolotl.sh
        container: qc.doc_chartreuse_methodical_panda
      gitlab.acnca.pt/eosc/eosc-synergy/sqaaas-api-server markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.flint_witty_parrot.sh
        container: qc.doc_ginger_nervous_porcupine
  QC.Lic:
    repos:
      gitlab.acnca.pt/eosc/eosc-synergy/sqaaas-api-server licensee:
        commands:
        - /usr/bin/env sh .sqa/script.teal_audacious_grizzly.sh
        container: qc.lic_gold_sociable_cockatoo
  QC.Met:
    repos:
      gitlab.acnca.pt/eosc/eosc-synergy/sqaaas-api-server cff-converter-python:
        commands:
        - /usr/bin/env sh .sqa/script.flax_playful_koala.sh
        container: qc.met_burgundy_visionary_serval
  QC.Sec:
    repos:
      gitlab.acnca.pt/eosc/eosc-synergy/sqaaas-api-server bandit:
        commands:
        - /usr/bin/env sh .sqa/script.horizon_blissful_mink.sh
        container: qc.sec_mustard_unique_dhole
  QC.Sty:
    repos:
      gitlab.acnca.pt/eosc/eosc-synergy/sqaaas-api-server flake8:
        commands:
        - /usr/bin/env sh .sqa/script.amethyst_bewildered_bullfrog.sh
        container: qc.sty_cream_adaptable_ferret
      gitlab.acnca.pt/eosc/eosc-synergy/sqaaas-api-server hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.mist_thankful_dingo.sh
        container: qc.sty_amethyst_tactful_kangaroo
      gitlab.acnca.pt/eosc/eosc-synergy/sqaaas-api-server jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.dawn_inspired_reindeer.sh
        container: qc.sty_lime_confused_hedgehog
  QC.Uni:
    repos:
      gitlab.acnca.pt/eosc/eosc-synergy/sqaaas-api-server pytest:
        commands:
        - /usr/bin/env sh .sqa/script.wine_happy_flounder.sh
        container: qc.uni_mauve_delighted_caribou
  QC.Ver:
