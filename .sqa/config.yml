config:
  credentials:
  - id: https://gitlab.acnca.pt/eosc/eosc-synergy/sqaaas-api-server
    password_var: GIT_PASSWORD
    username_var: GIT_USER
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    gitlab.acnca.pt/eosc/eosc-synergy/sqaaas-api-server:
      branch: testci
      credential_tmp: true
      credentials_id: https://gitlab.acnca.pt/eosc/eosc-synergy/sqaaas-api-server
      repo: https://gitlab.acnca.pt/eosc/eosc-synergy/sqaaas-api-server
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      gitlab.acnca.pt/eosc/eosc-synergy/sqaaas-api-server git:
        commands:
        - /usr/bin/env sh .sqa/script.cream_enthusiastic_marmoset.sh
        container: qc.acc_azure_aware_nymph
  QC.Doc:
    repos:
      gitlab.acnca.pt/eosc/eosc-synergy/sqaaas-api-server find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.gray_rugged_owl.sh
        container: qc.doc_slate_smart_badger
      gitlab.acnca.pt/eosc/eosc-synergy/sqaaas-api-server git:
        commands:
        - /usr/bin/env sh .sqa/script.heather_bold_toucan.sh
        container: qc.doc_cerise_helpful_sphinx
      gitlab.acnca.pt/eosc/eosc-synergy/sqaaas-api-server markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.ginger_compassionate_goose.sh
        container: qc.doc_jasmine_zealous_peacock
  QC.Lic:
    repos:
      gitlab.acnca.pt/eosc/eosc-synergy/sqaaas-api-server licensee:
        commands:
        - /usr/bin/env sh .sqa/script.cyan_mysterious_heron.sh
        container: qc.lic_grape_supportive_antelope
  QC.Met:
    repos:
      gitlab.acnca.pt/eosc/eosc-synergy/sqaaas-api-server cff-converter-python:
        commands:
        - /usr/bin/env sh .sqa/script.carmine_nurturing_chinchilla.sh
        container: qc.met_sunset_melancholy_gorilla
  QC.Sec:
    repos:
      gitlab.acnca.pt/eosc/eosc-synergy/sqaaas-api-server bandit:
        commands:
        - /usr/bin/env sh .sqa/script.jet_stubborn_dragon.sh
        container: qc.sec_snow_creative_leopard
  QC.Sty:
