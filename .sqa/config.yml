      github.com/eosc-synergy/sqaaas-api-server get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.daffodil_rational_coyote.sh
        container: qc.ver_denim_dreamy_marmoset
timeout: 5400
